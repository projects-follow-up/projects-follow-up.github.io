<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة متابعة المشاريع</title>
  <meta name="apple-mobile-web-app-title" content="متابعة المشاريع">
  <meta name="theme-color" content="#0f5c55">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f3f0ea; --card:#fff; --ink:#241b28; --muted:#62596a; --line:#d9d3c8; --plum:#241a2b; --plum-line:#4a3d52; --bronze:#a87d3e;
  --pri:#241a2b; --pri-2:#3a2b44; --pri-soft:#eee9f0; --st-ok:#2b6072; --st-late:#a8321e; --st-soon:#8a6412; --st-stop:#6b6570; --st-done:#476b4f;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --red:#a8321e; --red-soft:#f8e8e4; --amber:#8a6412; --amber-soft:#f7efdb;
  --purple:#5b4670; --purple-soft:#eee9f0; --blue:#2b6072; --blue-soft:#e4edf0;
  --grey:#6b6570; --grey-soft:#ece9ec; --green:#476b4f; --green-soft:#e7eee8;
  --r:8px; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px}

/* Top bar */
.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.brand-logo{height:44px;width:auto;display:block}
.brand-sep{width:1px;height:28px;background:rgba(255,255,255,.35)}
.login .card{overflow:hidden}
.rep-head{display:flex;align-items:center;gap:16px;background:var(--pri);color:#fff;border-radius:12px;padding:12px 16px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep-head img{height:56px;width:auto}
.rep-title{font-size:20px;font-weight:700}
.rep-sum{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0}
.rep-dept{margin-bottom:14px;break-inside:auto}
.rep-dept h2{font-size:16px;margin:10px 0 6px}
table.rep{background:#fff;font-size:13px}
table.rep td,table.rep th{padding:6px 5px}
table.rep tr.wo td{background:#f6faf9;font-size:12px}
.nowrap{white-space:nowrap}
@media print{table.rep{font-size:10.5px}table.rep tr{break-inside:avoid}.rep-sum{border-color:#ccc}}
@media (max-width:820px){table.rep{display:block;overflow-x:auto}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;padding:6px;background:#fafcfb}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.ph-empty{width:100%;aspect-ratio:4/3;border-radius:6px;background:var(--grey-soft);display:flex;align-items:center;justify-content:center;color:var(--pri)}
@media (max-width:820px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.login-band{background:var(--pri);margin:-24px -24px 18px;padding:22px 16px;display:flex;justify-content:center}
.login-band img{height:96px;width:auto;max-width:100%}
@media print{.brand-logo{filter:invert(1)}}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#d6ece9;padding:7px 12px;border-radius:8px;cursor:pointer}
.nav button.on,.nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.who{font-size:13px;color:#cfe6e2;display:flex;gap:8px;align-items:center}
.who button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}

/* Generic */
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#b9c6c3}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--pri-2)}
.btn.danger{color:var(--red);border-color:#f0c8c3}
.btn.sm{min-height:34px;padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.back{background:none;border:0;color:var(--pri);cursor:pointer;padding:4px 0;margin-bottom:6px;font-size:15px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:start;box-shadow:var(--shadow);border-top:4px solid var(--grey)}
.kpi:hover{transform:translateY(-1px)}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{font-size:14px;color:var(--muted)}
.kpi.red{border-top-color:var(--red)} .kpi.red .n{color:var(--red)}
.kpi.amber{border-top-color:#d98a10} .kpi.amber .n{color:var(--amber)}
.kpi.purple{border-top-color:var(--purple)} .kpi.purple .n{color:var(--purple)}
.kpi.dark{border-top-color:#7a2e2e} .kpi.dark .n{color:#7a2e2e}
.kpi.grey .n{color:var(--grey)}
.kpi.pri{border-top-color:var(--pri)} .kpi.pri .n{color:var(--pri)}

/* Badges */
.badge{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.b-red{background:var(--red-soft);color:var(--red)} .b-amber{background:var(--amber-soft);color:var(--amber)}
.b-purple{background:var(--purple-soft);color:var(--purple)} .b-grey{background:var(--grey-soft);color:var(--grey)}
.b-blue{background:var(--blue-soft);color:var(--blue)} .b-green{background:var(--green-soft);color:var(--green)}
.b-dark{background:#ece9ec;color:#4d4753} .b-pri{background:var(--pri-soft);color:var(--pri)}
.b-review{background:#fffbe6;color:#7a5d00;border:1px dashed #d9b84a}
.badges{display:flex;gap:5px;flex-wrap:wrap}

/* Filters + list */
.filters{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin-bottom:12px}
.filters input,.filters select,.field input,.field select,.field textarea{width:100%;border:1px solid #cdd7d4;border-radius:10px;padding:9px 11px;background:#fff;min-height:42px}
.field textarea{min-height:80px;resize:vertical}

.plist{display:flex;flex-direction:column;gap:8px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 150px 170px;gap:12px;align-items:center}
.pitem:hover{border-color:#9fbfb9}
.pitem .nm{font-weight:600}
.pitem .meta{font-size:13px;color:var(--muted)}
.bar{height:8px;background:#e7ecea;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.count{font-size:14px;color:var(--muted);margin:0 0 8px}

/* Detail */
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.big-progress{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.big-progress .bar{flex:1;height:12px}
.big-progress b{font-size:22px}
.note{background:#f8faf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.warnbox{background:var(--amber-soft);border:1px solid #f1d39a;color:#6b3f00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{border-inline-start:3px solid var(--pri-soft);padding:2px 14px 12px;position:relative}
.timeline li:before{content:"";position:absolute;inset-inline-start:-7px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--pri)}
.att{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att:last-child{border-bottom:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:start;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;background:#fafcfb}
table.t td.num,table.t th.num{text-align:center}
table.t td.click{cursor:pointer;color:var(--pri);font-weight:600}
.tscroll{overflow-x:auto}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,30,28,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{display:flex;justify-content:space-between;align-items:center}
.modal .x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px}
.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:14px}
.okbox{background:var(--green-soft);color:var(--green);border-radius:10px;padding:12px;margin-bottom:10px}
.prog{height:14px;background:#e7ecea;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog>i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.range{display:flex;gap:10px;align-items:center}
.range input[type=range]{flex:1}
.range input[type=number]{width:90px}

/* Toast + loading */
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:#123;color:#fff;padding:12px 18px;border-radius:12px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast.ok{background:var(--green)} .toast.bad{background:var(--red)}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px 0;justify-content:center}
.spin{width:22px;height:22px;border:3px solid #cfe1dd;border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Login */
.login{max-width:420px;margin:8vh auto;padding:0 16px}
.login .card{padding:24px}
.login h1{text-align:center}
.codein{letter-spacing:10px;text-align:center;font-size:24px!important;direction:ltr}

.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.ltr{direction:ltr;unicode-bidi:embed}
.print-only{display:none}

@media (max-width:820px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .s{grid-column:1/-1}
  .pitem{grid-template-columns:1fr;gap:6px}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:0 0}
  .kv dt{margin-top:8px;font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .n{font-size:26px}
  .who .em{display:none}
  .wrap{padding:12px}
  h1{font-size:19px}
}

/* ---------- Approved design ---------- */
html,body{overflow-x:clip}
.i{width:20px;height:20px;flex:none;vertical-align:middle}
h1,h2,.brand{font-family:var(--display);font-weight:600}
h1{font-size:26px;line-height:1.4}h2{font-size:18px;line-height:1.5}
.top{position:static;background:var(--plum)}.topline{padding-block:10px!important;gap:10px 18px}
.brand{font-size:16px}.who{color:#d8d0dc}.who button{display:inline-flex;gap:6px;align-items:center;min-height:36px;background:none;border:1px solid var(--plum-line)}
.navline{border-top:1px solid var(--plum-line);overflow-x:auto}.nav.wrap{flex-wrap:nowrap;padding-block:0;gap:2px}
.nav button{display:flex;align-items:center;gap:7px;white-space:nowrap;min-height:46px;border-radius:0;border-bottom:2px solid transparent;color:#d8d0dc;padding:6px 11px}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.on{background:none;color:#fff;border-bottom-color:var(--bronze)}
main.wrap{max-width:1180px}
.exec{margin-inline:calc(50% - 50vw);margin-top:-16px;padding:22px max(16px,calc(50vw - 574px)) 0;background:linear-gradient(112deg,#241a2b 0 58%,#2c2035 58% 76%,#35273f 76% 100%);color:#fff}
.exec h1{color:#fff;margin:0;font-size:28px}
.ehead{display:flex;justify-content:space-between;align-items:baseline;gap:6px 20px;flex-wrap:wrap;color:#cfc6d4;font-size:14px}
.ekpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px;border-top:1px solid var(--plum-line)}
.ek{background:none;border:0;border-inline-start:1px solid var(--plum-line);padding:15px 18px 19px;text-align:start;color:#fff;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 11px;align-items:center}
.ek:first-child{border-inline-start:0;padding-inline-start:0}.ek:hover{background:rgba(255,255,255,.05)}
.ek .i{width:32px;height:32px}.ek b{font:600 34px/1.1 var(--display)}.ek span{grid-column:1/-1;font-size:13.5px;color:#d8d0dc}
.e-overdue .i{color:#ef9a88}.e-approaching .i{color:#e8c67a}.e-stopped .i{color:#c5bdce}.e-active .i{color:#d2b67f}
.sect{margin-top:28px}.phead{margin-bottom:12px}.phead h1{margin:6px 0 2px}
.st-ok{--s:var(--st-ok)}.st-late{--s:var(--st-late)}.st-soon{--s:var(--st-soon)}.st-stop{--s:var(--st-stop)}.st-done{--s:var(--st-done)}.st-more{--s:var(--muted)}
.bm-cur{margin-bottom:18px}.bm-head{display:flex;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;font-size:14px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:10px}
.bm-dept{margin-bottom:12px}.bm-dname{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;font-weight:600;margin-bottom:5px}.bm-dname span{font-weight:400;color:var(--muted)}
.bm-cells{display:flex;flex-wrap:wrap;gap:6px}
.bm-cell{min-height:76px;min-width:0;max-width:100%;padding:8px 11px;cursor:pointer;text-align:start;display:flex;flex-direction:column;justify-content:space-between;gap:6px;font-size:13.5px;line-height:1.45;color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--s);border-radius:6px;background:color-mix(in srgb,var(--s) 10%,#fff)}
.bm-cell:hover{border-color:var(--s)}.bm-cell b{font-weight:600;text-align:right}
.legend{display:flex;gap:5px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;background:var(--s)}
.plist{gap:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pitem{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:0;padding-inline-end:16px;grid-template-columns:96px minmax(0,1fr) 190px 165px;gap:16px;text-align:start;font:inherit;color:inherit}
.pitem:last-child{border-bottom:0}.pitem:hover{background:#faf8f4;border-color:var(--line)}
.thumb{align-self:stretch;min-height:82px;background:linear-gradient(135deg,#e7e3ea 0 62%,#dcd6e0 62%);display:grid;place-items:center;color:#7d7289}.thumb .i{width:28px;height:28px}
.pmain{display:flex;flex-direction:column;gap:1px;padding-block:10px;min-width:0}.pmain .nm{font-size:15px}
.miss{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12.5px;color:var(--muted);margin-top:4px}.miss span{display:inline-flex;align-items:center;gap:4px}.miss .i{width:16px;height:16px}
.pprog{display:flex;flex-direction:column;gap:6px}.mrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.mrow .meta{font-size:12.5px;color:var(--muted)}
.seg{height:8px;position:relative;background:#e6e1da}.seg>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--plum)}.seg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#fff calc(10% - 2px) 10%)}.pitem:hover .seg::after{background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#faf8f4 calc(10% - 2px) 10%)}
.seg u{position:absolute;z-index:1;top:-3px;bottom:-3px;width:3px;background:var(--bronze)}
.pstate{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--s)}.pstate>.i{width:36px;height:36px;padding:7px;border-radius:9px;background:color-mix(in srgb,var(--s) 11%,#fff)}.pstate b{display:block;font-weight:600}.pstate small{display:block;color:var(--muted);font-size:12.5px}
.pband{padding-bottom:20px}.pband .back{color:#fff;display:block;margin-bottom:6px}.psub{color:#d8d0dc;font-size:14px}.pband .btn{background:rgba(255,255,255,.08);border-color:var(--plum-line);color:#fff}.pband .btn.pri{background:var(--bronze);border-color:var(--bronze)}.pband .btn.danger{color:#f3b4a8}.pband .who-t,.pband .muted{color:#d8d0dc}
.tbar{display:flex;gap:2px;height:8px;margin-top:16px}.t-done{background:#d2b67f}.t-over{background:#ef9a88}.t-left{background:rgba(255,255,255,.22)}
.tlabels{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;font-size:13px;margin-top:6px;color:#e5deea}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);margin-top:14px}
.fact{padding:12px 16px;border-inline-start:1px solid var(--line);min-width:0}.fact:first-child{border-inline-start:0}.fact small{display:block;color:var(--muted);font-size:12.5px}.fact b{font:600 19px/1.5 var(--display);overflow-wrap:anywhere}
.pbadges{margin-top:12px}.yn .i{width:22px;height:22px}.yn.y{color:var(--st-done)}.yn.n{color:var(--st-late)}
@media (min-width:901px){.card>dl.kv{grid-template-columns:170px minmax(0,1fr) 170px minmax(0,1fr)}.grid2 .card>dl.kv{grid-template-columns:150px minmax(0,1fr)}}
input[type=range],.check input{accent-color:var(--plum)}
.tl-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-top:14px}
.tl-top{display:flex;justify-content:space-between;align-items:center;gap:6px 18px;flex-wrap:wrap;margin-bottom:14px}.tl-top h2{margin:0}.tl-top strong{font:600 18px/1.5 var(--display);color:var(--s)}
.tl-dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.tl-date small{display:block;color:var(--muted);font-size:14px}.tl-date b{display:block;font-size:18px;font-weight:600}.tl-date:nth-child(2){text-align:center}.tl-date:nth-child(3){text-align:end}
.tl-bar{display:flex;gap:2px;height:18px;background:#e6e1da}.k-used{background:var(--plum)}.k-over{background:var(--st-late)}.k-left{background:#d9d3c8}
.tl-key{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:11px;font-size:15px}.tl-key span{display:inline-flex;align-items:center;gap:7px}.tl-key i{width:14px;height:14px;display:inline-block}
@media (max-width:560px){.tl-card{padding:14px}.tl-date b{font-size:15px}.tl-date small{font-size:12.5px}}
@media print{.tl-card{break-inside:avoid}.tl-bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.gapfact b{color:var(--s)}.time-facts .fact small+b+small{margin-top:1px}

<script>
(function () {
'use strict';

// ---------- State & utilities ----------
var S = { token: null, boot: null, view: null, params: {}, detail: null, f: {}, admin: null, adminTab: 'users' };
var $app = document.getElementById('app');
var $modal = document.getElementById('modal-root');

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function fmtDate(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : esc(iso); }
function fmtStamp(s) { if (!s) return '—'; return fmtDate(String(s).slice(0, 10)) + (String(s).length > 10 ? ' ' + String(s).slice(11, 16) : ''); }
function fmtNum(n) { return n === '' || n === null || n === undefined || isNaN(Number(n)) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function fmtSize(b) { b = Number(b) || 0; return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function addDays(iso, n) {
  var p = String(iso).split('-');
  if (p.length !== 3) return '';
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) + n * 86400000).toISOString().slice(0, 10);
}
function $(sel, root) { return (root || document).querySelector(sel); }
function val(id) { var el = document.getElementById(id); if (!el) return ''; return el.type === 'checkbox' ? el.checked : el.value.trim(); }

function call(action, payload, opts) {
  return rawCall(action, payload, opts).catch(function (e) {
    var admin = false; try { admin = editAll(); } catch (x) { }
    if (e.override && admin && !(payload || {}).force &&
      window.confirm(e.message + '\n\nلديك صلاحية الحفظ رغم ذلك. هل تريد الحفظ؟ سيُسجَّل ذلك في سجل التعديلات.')) {
      return rawCall(action, Object.assign({}, payload, { force: true }), opts);
    }
    throw e;
  });
}
function rawCall(action, payload, opts) {
  opts = opts || {};
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (!r) return reject(new Error('لم يصل رد من الخادم. حاول مرة أخرى.'));
        if (r.ok) return resolve(r.data);
        if (r.auth) { endSession(); }
        var err = new Error(r.error || 'حدث خطأ'); err.override = !!r.override; reject(err);
      })
      .withFailureHandler(function (e) {
        reject(new Error('تعذر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مرة أخرى.' + (e && e.message ? ' (' + e.message + ')' : '')));
      })
      .api({ action: action, token: S.token, payload: payload || {}, requestId: opts.requestId || null });
  });
}

var toastTimer;
function toast(msg, kind) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, kind === 'bad' ? 7000 : 4000);
}

var IND = {
  overdue: { label: 'تجاوزت تاريخ الإنهاء التعاقدي', cls: 'red' },
  approaching: { label: 'تقترب من تاريخ الإنهاء التعاقدي', cls: 'amber' },
  stopped: { label: 'مشاريع متوقفة', cls: 'dark' },
  stale: { label: 'لم تُحدَّث مؤخراً', cls: 'grey' },
  missingDocs: { label: 'مستندات مطلوبة ناقصة', cls: 'amber' },
  missingPhotos: { label: 'صور الموقع لهذا الشهر ناقصة', cls: 'red' }
};
function role() { return S.boot ? S.boot.user.role : ''; }
function deptRole() { return role() === 'dept_head' || role() === 'engineer'; }
// Shows a person's name (and job title) instead of the bare email when they are a registered user.
function who(email, withTitle) {
  var p = S.boot && S.boot.people ? S.boot.people[email] : null;
  if (!email) return '—';
  if (!p || !p.name) return '<span class="ltr">' + esc(email) + '</span>';
  return '<span title="' + esc(email) + '">' + esc(p.name) + (withTitle && p.title ? ' <span class="muted">(' + esc(p.title) + ')</span>' : '') + '</span>';
}
// Admin and municipal engineer edit every project (the municipal engineer does not run the platform).
function editAll() { return role() === 'admin' || role() === 'city_engineer'; }
function isMgmt() { return role() === 'admin' || role() === 'management'; }
function deptName(id) { var d = (S.boot.departments || []).filter(function (x) { return x.id === id; })[0]; return d ? d.name : id; }
function proj(id) { return S.boot.projects.filter(function (p) { return p.id === id; })[0]; }
function editableProjects() {
  if (editAll()) return S.boot.projects;
  if (!deptRole()) return [];
  return S.boot.projects.filter(function (p) { return S.boot.user.deptIds.indexOf(p.deptId) >= 0; });
}

function statusBadge(s) {
  var cls = { 'منجز': 'b-green', 'قيد التنفيذ': 'b-blue', 'متوقف': 'b-dark', 'قيد الاستلام': 'b-pri', 'لم يبدأ': 'b-grey' }[s] || 'b-grey';
  return '<span class="badge ' + cls + '">' + esc(s || 'غير محدد') + '</span>';
}
function indBadges(p) {
  var i = p.ind, out = [];
  if (i.stopped) out.push('<span class="badge b-dark">متوقف</span>');
  if (i.awaitingClosure) out.push('<span class="badge b-blue">سُلّم فعلياً - بانتظار الإغلاق</span>');
  if (i.stale) out.push('<span class="badge b-grey">' + (i.daysSinceUpdate === null ? 'لم يُحدَّث بعد' : (i.neverUpdated ? 'لم يُحدَّث منذ إضافته قبل ' : 'آخر تحديث قبل ') + i.daysSinceUpdate + ' يوم') + '</span>');
  if (i.noEndDate) out.push('<span class="badge b-grey">لا يوجد تاريخ إنجاز</span>');
  if (i.missingPhotos) out.push('<span class="badge b-red">صور الشهر: ' + p.photos.count + ' من ' + p.photos.required + '</span>');
  if (i.missingDocs) out.push('<span class="badge b-amber" title="' + esc(p.missingDocs.join('، ')) + '">مستندات ناقصة (' + p.missingDocs.length + ')</span>');
  return '<div class="badges">' + out.join('') + '</div>';
}
function progressText(p) {
  if (p.fw) return p.fw.usedPct === null ? '—' : fmtNum(p.fw.usedPct) + '%';
  if (p.progress === '' || p.progress === null) return p.status === 'منجز' ? 'منجز' : 'غير مُدخلة';
  return fmtNum(p.progress) + '%';
}
function progressBar(p) {
  if (p.fw) return '<div class="bar" title="الموازنة المستخدمة"><i style="width:' + Math.min(100, p.fw.usedPct || 0) + '%"></i></div>';
  var v = p.progress === '' ? (p.status === 'منجز' ? 100 : 0) : Math.min(100, Number(p.progress));
  return '<div class="bar" title="نسبة الإنجاز الفعلية"><i style="width:' + v + '%"></i></div>';
}
function stateOf(p) {
  var i = p.ind;
  if (i.overdue) return { key: 'late', icon: 'overdue', text: 'متأخر ' + dayCount(-i.daysLeft) };
  if (i.stopped) return { key: 'stop', icon: 'stopped', text: 'متوقف' };
  if (i.approaching) return { key: 'soon', icon: 'approaching', text: 'متبقٍ ' + dayCount(i.daysLeft) };
  if (p.status === 'منجز') return { key: 'done', icon: 'yes', text: 'منجز' };
  if (i.awaitingClosure) return { key: 'done', icon: 'yes', text: 'سُلّم، بانتظار الإغلاق' };
  return { key: 'ok', icon: 'active', text: i.daysLeft === null || i.daysLeft < 0 ? 'لا يوجد موعد إنجاز' : 'متبقٍ ' + dayCount(i.daysLeft) };
}
function quoteCount(n) { return n === 1 ? 'استدراج واحد' : n === 2 ? 'استدراجان' : n + (n >= 3 && n <= 10 ? ' استدراجات' : ' استدراجاً'); }
function dayCount(n) { return n === 1 ? 'يوم واحد' : n === 2 ? 'يومان' : n + (n >= 3 && n <= 10 ? ' أيام' : ' يوماً'); }
// Progress the dates would expect today: elapsed share of start order to approved completion date.
function expectedProgress(p) {
  var end = p.ind.applicableEnd;
  if (!p.ntpDate || !end || !p.ind.active || p.ind.overdue || p.ind.daysLeft < 0) return null;
  var total = dayDiff(p.ntpDate, end);
  if (total <= 0) return null;
  return Math.max(0, Math.min(100, Math.round(dayDiff(p.ntpDate, S.boot.today) / total * 100)));
}
// Time passed in a framework agreement: start order to its end date (numbers and percentage).
function fwTime(p) {
  var end = p.ind.applicableEnd;
  if (!p.ntpDate || !end) return null;
  var total = dayDiff(p.ntpDate, end), used = Math.max(0, Math.min(total, dayDiff(p.ntpDate, S.boot.today)));
  return total > 0 ? { days: used, total: total, pct: Math.round(used / total * 100) } : null;
}
function segMeter(p) {
  if (p.fw) { var t = fwTime(p); return '<div class="seg"><i style="width:' + Math.min(100, p.fw.usedPct || 0) + '%"></i>' + (t ? '<u style="inset-inline-start:' + t.pct + '%" title="الوقت المنقضي ' + t.pct + '%"></u>' : '') + '</div>'; }
  var v = p.progress === '' || p.progress === null ? (p.status === 'منجز' ? 100 : 0) : Math.min(100, Number(p.progress));
  var x = expectedProgress(p);
  return '<div class="seg"><i style="width:' + v + '%"></i>' + (x === null ? '' : '<u style="inset-inline-start:' + x + '%" title="المتوقع حسب التاريخ ' + x + '%"></u>') + '</div>';
}
// Current project value: original value + variation-order changes (server sends currentValue).
function cv(p) { return p.currentValue !== undefined ? p.currentValue : p.contractValue; }
function totalsText(ps, sep) {
  var m = {};
  ps.forEach(function (p) { if (cv(p) !== '' && cv(p) !== null) { var k = p.currency || ''; m[k] = (m[k] || 0) + Number(cv(p)); } });
  return Object.keys(m).map(function (k) { return k ? money(m[k], k) : fmtNum(m[k]) + ' (عملة غير محددة)'; }).join(sep || '، ');
}
function money(v, cur) { return fmtNum(v) + (cur ? ' ' + esc(cur) : ''); }
function attentionScore(p) {
  var i = p.ind;
  if (!i.active) return 90;
  if (i.overdue) return 0; if (i.stopped) return 1; if (i.approaching) return 3; if (i.missingDocs || i.missingPhotos) return 4; if (i.stale) return 5;
  return 6;
}
function sortProjects(list) {
  return list.slice().sort(function (a, b) {
    var d = attentionScore(a) - attentionScore(b);
    if (d) return d;
    var x = a.ind.daysLeft === null ? 99999 : a.ind.daysLeft, y = b.ind.daysLeft === null ? 99999 : b.ind.daysLeft;
    return x - y;
  });
}

// ---------- Navigation ----------
function go(view, params, noPush) {
  S.view = view; S.params = params || {};
  if (!noPush) { try { google.script.history.push({ v: view, p: JSON.stringify(S.params) }); } catch (e) { } }
  render();
  window.scrollTo(0, 0);
}
try {
  google.script.history.setChangeHandler(function (e) {
    var st = e.state || {};
    if (!S.boot) return;
    S.view = st.v || homeView();
    try { S.params = st.p ? JSON.parse(st.p) : {}; } catch (x) { S.params = {}; }
    closeModal(true);
    render();
  });
} catch (e) { }

function homeView() { return deptRole() ? 'mine' : 'dash'; }

function navItems() {
  var r = role(), items = [];
  if (deptRole()) items.push(['mine', 'مشاريعي'], ['dash', 'لوحة المتابعة'], ['upload', 'رفع مستند'], ['report', 'سجل المشاريع']);
  else {
    items.push(['dash', 'لوحة المتابعة'], ['list', 'جميع المشاريع']);
    if (editAll()) items.push(['upload', 'رفع مستند']);
    items.push(['activity', 'سجل التعديلات'], ['report', 'سجل المشاريع']);

  }
  return items;
}

function shell(content) {
  var u = S.boot.user;
  var cur = S.view === 'project' ? (S.params.from || '') : S.view;
  return '<header class="top"><div class="wrap topline">' +
    '<div class="brand"><img class="brand-logo" src="' + PM_LOGO + '" alt="بلدية نابلس"><span class="brand-sep"></span>منصة متابعة المشاريع</div>' +
    '<div class="who"><span>' + esc(u.name || '') + '، ' + esc(u.title || u.roleLabel) + '</span><span class="em ltr">' + esc(u.email) + '</span><button data-act="logout">' + ic('logout') + 'خروج</button></div></div>' +
    '<div class="navline"><nav class="nav wrap" aria-label="القائمة">' + navItems().map(function (n) { return '<button data-act="nav" data-arg="' + n[0] + '" class="' + (cur === n[0] ? 'on' : '') + '">' + ic(n[0]) + n[1] + '</button>'; }).join('') + '</nav></div>' +
    '</header><main class="wrap">' + content + '</main>';
}

function render() {
  if (!S.token) return renderLogin();
  if (!S.boot) { $app.innerHTML = loading(); return; }
  var v = S.view || homeView();
  var html;
  if (v === 'dash') html = viewDash();
  else if (v === 'mine' || v === 'list') html = viewList(v);
  else if (v === 'project') html = viewProject();
  else if (v === 'upload') html = viewUploadPage();
  else if (v === 'report') html = viewReport();
  else if (v === 'archive') { S.f = { __set: 1, status: 'منجز' }; S.view = deptRole() ? 'mine' : 'list'; html = viewList(S.view); }
  else if (v === 'annual') { S.rf = { status: 'all', year: String(S.boot.today).slice(0, 4) }; S.view = 'report'; html = viewReport(); }
  else if (v === 'admin') html = viewAdmin();
  else if (v === 'activity') html = viewActivity();
  else html = viewDash();
  $app.innerHTML = shell(html);
  afterRender(v);
}

function afterRender(v) {
  if (v === 'mine' || v === 'list') bindFilters();
  if (v === 'project' && (!S.detail || S.detail.project.id !== S.params.id)) loadDetail(S.params.id);
  if (v === 'admin' && !S.admin) loadAdmin();
  if (v === 'activity') { if (!S.activity) loadActivity(); else bindActivity(); }
  if (v === 'report' || v === 'annual') bindRegister();
}

async function refreshBoot() {
  S.boot = await call('bootstrap');
}

// ---------- Login ----------
var loginStage = 'email';

  $app.innerHTML = '<div class="login"><div class="card">' +
    '<div class="login-band"><img src="' + PM_LOGO + '" alt="بلدية نابلس"></div>' +

      '<input id="l-email" type="email" class="ltr" autocomplete="email" required value="' + esc(email) + '" placeholder="name@gmail.com"></div>' +
      '<button class="btn pri" style="width:100%;justify-content:center" type="submit">إرسال رمز الدخول</button>' +
      '<p class="muted small" style="margin-top:12px">سيصلك رمز من 6 أرقام على بريدك. إذا لم يصل خلال دقيقتين تحقق من مجلد الرسائل غير المرغوب فيها (Spam).</p></form>'
      :
      '<form id="f-code"><p class="small">أُرسل رمز الدخول إلى <b class="ltr">' + esc(email) + '</b></p>' +
      '<div class="field"><label for="l-code">رمز الدخول</label>' +
      '<input id="l-code" class="codein" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>' +
      '<button class="btn pri" style="width:100%;justify-content:center" type="submit">دخول</button>' +
      '<div class="row" style="justify-content:space-between;margin-top:10px"><button type="button" class="back" data-act="login-back">تغيير البريد</button>' +
      '<button type="button" class="back" data-act="login-resend">إعادة إرسال الرمز</button></div></form>') +
    '</div></div>';

  var inp = $('#l-email') || $('#l-code');

async function sendCode(resend) {
  var email = resend ? lsGet('pm_email') : val('l-email');
  var btn = $('#app button[type=submit]');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ الإرسال...'; }
  try {
    await call('auth.requestCode', { email: email });
    lsSet('pm_email', String(email).toLowerCase());
    loginStage = 'code';
    renderLogin(null, resend ? 'تم إرسال رمز جديد.' : null);
  } catch (e) { renderLogin(e.message); }
}
async function verify() {
  var btn = $('#app button[type=submit]');
  btn.disabled = true; btn.textContent = 'جارٍ التحقق...';
  try {
    var r = await call('auth.verify', { email: lsGet('pm_email'), code: val('l-code') });
    S.token = r.token; lsSet('pm_token', r.token);
    loginStage = 'email';
    await start();
  } catch (e) { renderLogin(e.message); }
}
function endSession() { S.token = null; S.boot = null; lsSet('pm_token', null); loginStage = 'email'; closeModal(true); }

async function start() {
  $app.innerHTML = loading();
  try {
    await refreshBoot();
    go(homeView(), {}, false);
  } catch (e) {
    if (!S.token) renderLogin(e.message);
    else $app.innerHTML = '<div class="login"><div class="card"><div class="err">' + esc(e.message) + '</div><button class="btn pri" data-act="reload">إعادة المحاولة</button></div></div>';
  }
}

// ---------- Dashboard ----------
function budgetMap(active) {
  // Grouped by department first; each department shows its total per currency on one line
  // (currencies are never added together). A box's width compares it only with the
  // department's other projects in the same currency.
  var byDept = {}, noValue = 0;
  active.forEach(function (p) {
    if (cv(p) === '' || cv(p) === null) { noValue++; return; }
    (byDept[p.deptId] = byDept[p.deptId] || []).push(p);
  });
  var depts = Object.keys(byDept).sort(function (a, b) { return byDept[b].length - byDept[a].length || deptName(a).localeCompare(deptName(b), 'ar'); });
  if (!depts.length) return '';
  var LIMIT = 12;
  var html = depts.map(function (dk) {
    var ps = byDept[dk].sort(function (a, b) { return (a.currency || '').localeCompare(b.currency || '') || cv(b) - cv(a); });
    var curSum = {};
    ps.forEach(function (p) { var c = p.currency || ''; curSum[c] = (curSum[c] || 0) + Number(cv(p)); });
    var shown = ps.slice(0, LIMIT), rest = ps.slice(LIMIT);
    var cell = function (p) {
      var st = stateOf(p), sum = curSum[p.currency || ''], pct = sum ? cv(p) / sum * 100 : 0;
      return '<button type="button" class="bm-cell st-' + st.key + '" style="flex:1 1 max(170px,' + pct.toFixed(1) + '%)" data-act="open" data-arg="' + esc(p.id) + '"><span>' + esc(p.name) + '</span><b class="ltr">' + (p.currency ? money(cv(p), p.currency) : fmtNum(cv(p)) + ' (عملة غير محددة)') + '</b></button>';
    };
    return '<div class="bm-dept"><div class="bm-dname">' + esc(deptName(dk)) + (ps.length > 1 ? '<span>' + totalsText(ps, ' + ') + '</span>' : '') + '</div><div class="bm-cells">' + shown.map(cell).join('') +
      (rest.length ? '<button type="button" class="bm-cell st-more" style="flex:1 1 170px" data-act="cell" data-arg="' + esc(dk + '|active') + '"><span>' + rest.length + ' مشاريع أخرى</span><b class="ltr">' + totalsText(rest, ' + ') + '</b></button>' : '') + '</div></div>';
  }).join('');
  return '<section class="sect"><h2>توزيع الموازنات حسب القسم</h2>' + html +
    '<div class="legend"><span class="st-ok"><i></i>ضمن الموعد</span><span class="st-late"><i></i>تجاوز الموعد</span><span class="st-soon"><i></i>يقترب</span><span class="st-stop"><i></i>متوقف</span></div>' +
    (noValue ? '<p class="muted small">' + noValue + ' مشروع نشط بلا قيمة مسجلة لا يظهر هنا.</p>' : '') + '</section>';
}

function viewDash() {
  var b = S.boot, ps = b.projects;
  var active = ps.filter(function (p) { return p.ind.active; });
  var cnt = function (k) { return ps.filter(function (p) { return p.ind[k]; }).length; };
  var kpi = function (k, n, label) { return '<button class="ek e-' + k + '" data-act="kpi" data-arg="' + k + '">' + ic(k) + '<b>' + n + '</b><span>' + label + '</span></button>'; };
  var html = '<section class="exec"><div class="ehead"><h1>' + (role() === 'engineer' && S.boot.engineerOwn ? 'لوحة متابعة مشاريعي' : deptRole() ? 'لوحة متابعة مشاريع قسمي' : 'لوحة المتابعة') + '</h1><span>بتاريخ ' + fmtDate(b.today) + (totalsText(active) ? '، إجمالي موازنات المشاريع النشطة: ' + totalsText(active) : '') + '</span></div>' +
    '<div class="ekpi">' + kpi('overdue', cnt('overdue'), IND.overdue.label) + kpi('approaching', cnt('approaching'), IND.approaching.label) + kpi('stopped', cnt('stopped'), IND.stopped.label) + kpi('active', active.length, 'المشاريع النشطة') + '</div></section>';
  if (!ps.length) {
    return html + '<div class="card" style="text-align:center;padding:30px"><h2>لا توجد مشاريع بعد</h2><p class="muted">ابدأ بإضافة أول مشروع، ثم يقوم رؤساء الأقسام بتحديثه.</p>' +
      (editAll() || deptRole() ? '<button class="btn pri" data-act="new-project">+ إضافة مشروع جديد</button>' : '') + '</div>';
  }

  var attention = sortProjects(active.filter(function (p) { return attentionScore(p) <= 5; }));
  html += '<section class="sect"><h2>أهم ما يحتاج متابعة</h2>' +
    (attention.length ? '<div class="plist">' + attention.map(projectItem).join('') + '</div>' : '<div class="card muted">لا توجد مشاريع تحتاج متابعة عاجلة.</div>') + '</section>';
  return html;

// ---------- Archive and annual report ----------
// A finished project belongs to the year it ended; anything not finished stays alive and is never archived.
function endYear(p) { return p.actualCompletionDate ? String(p.actualCompletionDate).slice(0, 4) : ''; }
function finishedProjects() { return S.boot.projects.filter(function (p) { return p.status === 'منجز'; }); }
// ---------- Lists ----------
function projectItem(p) {
  var st = stateOf(p), x = expectedProgress(p), ms = [], i = p.ind, ft = p.fw ? fwTime(p) : null;
  var live = i.active;
  if (live && p.rc && p.rc.lateQuotes) ms.push('<span>' + ic('overdue') + (p.rc.lateQuotes === 1 ? 'استدراج متأخر' : p.rc.lateQuotes + ' استدراجات متأخرة') + '</span>');
  if (live && i.missingPhotos) ms.push('<span>' + ic('cam') + 'صور ' + p.photos.count + ' من ' + p.photos.required + '</span>');
  if (live && i.missingDocs) ms.push('<span title="' + esc(p.missingDocs.join('، ')) + '">' + ic('file') + (p.missingDocs.length === 1 ? 'مستند ناقص واحد' : p.missingDocs.length + ' مستندات ناقصة') + '</span>');
  if (live && i.stale) ms.push('<span>' + ic('stale') + (i.daysSinceUpdate === null ? 'لم يُحدَّث بعد' : 'آخر تحديث قبل ' + dayCount(i.daysSinceUpdate)) + '</span>');
  return '<button type="button" class="pitem" data-act="open" data-arg="' + esc(p.id) + '">' +
    '<span class="thumb">' + ic('image') + '</span>' +
    '<span class="pmain"><span class="nm">' + esc(p.name) + '</span><span class="meta">' + esc(deptName(p.deptId)) + (p.contractor ? '، ' + esc(p.contractor) : '') +
    (p.tenderNo ? '، رقم <span class="ltr">' + esc(p.tenderNo) + '</span>' : '') + '</span>' +
    (p.fw ? '<span class="meta">اتفاقية إطار: ' + p.fw.orders + ' قرار فرعي، المستخدم ' + money(p.fw.committed, p.currency) + ' من ' + money(p.fw.ceiling, p.currency) + '</span>' : '') +
    (p.rc ? '<span class="meta">مشروع تعافي: ' + quoteCount(p.rc.quotes) + (p.rc.activeWorkers !== '' ? '، العمال في الموقع ' + p.rc.activeWorkers : '') + '</span>' : '') +
    (ms.length ? '<span class="miss">' + ms.join('') + '</span>' : '') + '</span>' +
    '<span class="pprog"><span class="mrow"><b>' + (p.fw ? 'الموازنة المستخدمة ' : '') + progressText(p) + '</b>' + (ft ? '<span class="meta">الوقت المنقضي ' + ft.pct + '%</span>' : x === null ? '' : '<span class="meta">المتوقع ' + x + '%</span>') + '</span>' + segMeter(p) + '</span>' +
    '<span class="pstate st-' + st.key + '">' + ic(st.icon) + '<span><b>' + st.text + '</b><small>' + fmtDate(i.applicableEnd) + '</small></span></span></button>';
}

function filterProjects(f) {
  var q = (f.q || '').toLowerCase();
  return S.boot.projects.filter(function (p) {
    if (f.dept && p.deptId !== f.dept) return false;
    if (f.status === 'active' && !p.ind.active) return false;
    if (f.status && f.status !== 'active' && f.status !== 'all' && (p.status || 'غير محدد') !== f.status) return false;
    if (f.ind && f.ind !== 'active' && !p.ind[f.ind]) return false;
    if (f.funder && p.funder !== f.funder) return false;
    if (f.eng === '__none') { if (p.supervisorEmail) return false; }
    else if (f.eng && (p.supervisor || p.supervisorEmail) !== f.eng) return false;
    if (f.year && (p.status !== 'منجز' || endYear(p) !== f.year)) return false;
    if (f.method && (f.method === 'none' ? p.contractMethod : p.contractMethod !== f.method)) return false;
    if (q) {
      var hay = [p.name, p.tenderNo, p.decisionNo, p.contractor, p.supervisor, p.funder, p.id, deptName(p.deptId), p.contractMethod].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function viewList(v) {
  if (!S.f.__set) S.f = { status: 'active', __set: 1 };
  var f = S.f, b = S.boot;
  var funders = {}, engs = {}, yrs = {}; b.projects.forEach(function (p) { if (p.funder) funders[p.funder] = 1; var e = p.supervisor || p.supervisorEmail; if (e) engs[e] = 1; if (p.status === 'منجز' && endYear(p)) yrs[endYear(p)] = 1; });
  var opt = function (value, label, cur) { return '<option value="' + esc(value) + '"' + (String(cur || '') === String(value) ? ' selected' : '') + '>' + esc(label) + '</option>'; };

  var head = v === 'mine' ? 'مشاريعي' : 'جميع المشاريع';
  var canAdd = editAll() || deptRole();
  return '<div class="row" style="justify-content:space-between"><h1>' + head + '</h1>' + (canAdd ? '<button class="btn" data-act="new-project">+ مشروع جديد</button>' : '') + '</div>' +
    '<div class="filters">' +
    '<input class="s" id="f-q" aria-label="بحث في المشاريع" type="search" placeholder="بحث: اسم المشروع، رقم العطاء، المقاول، المهندس..." value="' + esc(f.q || '') + '">' +
    '<select id="f-status" aria-label="تصفية حسب الحالة">' + opt('active', 'المشاريع النشطة', f.status) + opt('all', 'كل المشاريع', f.status) + b.statuses.map(function (s) { return opt(s, s, f.status); }).join('') + '</select>' +
    '<select id="f-ind" aria-label="تصفية حسب التنبيه">' + opt('', 'كل التنبيهات', f.ind) + Object.keys(IND).map(function (k) { return opt(k, IND[k].label, f.ind); }).join('') + '</select>' +

// ---------- Opening files ----------
// Reads a file through the platform in pieces (three at a time) and returns it as a Blob.
async function fetchFile(kind, id, onProgress) {
  var read = async function (offset) {
    for (var i = 0; ; i++) {
      try { return await call('file.read', { kind: kind, id: id, offset: offset }); }
      catch (e) { if (i >= 2 || !S.token) throw e; await sleep(1500); }
    }
  };
  var toBytes = function (b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  var first = await read(0);
  var parts = [toBytes(first.data)], done = parts[0].length, offsets = [];
  for (var o = first.chunkSize; o < first.size; o += first.chunkSize) offsets.push(o);
  onProgress(done / first.size);
  var worker = async function () {
    while (offsets.length) {
      var off = offsets.shift();
      var bytes = toBytes((await read(off)).data);
      parts[off / first.chunkSize] = bytes;
      done += bytes.length;
      onProgress(done / first.size);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  return { blob: new Blob(parts, { type: first.mimeType }), name: first.fileName, mime: first.mimeType };
}

var fileBusy = false;
async function openFile(kind, id, save) {
  if (fileBusy) { toast('يتم فتح ملف آخر، يرجى الانتظار', 'bad'); return; }
  fileBusy = true;
  // The tab must be opened during the click, or the browser blocks it.
  var tab = save ? null : window.open('', '_blank');
  var show = function (msg) {
    toast(msg); clearTimeout(toastTimer);
    try { if (tab) tab.document.body.innerHTML = '<p dir="rtl" style="font:18px sans-serif;text-align:center;margin-top:40px">' + esc(msg) + '</p>'; } catch (e) { }
  };
  show('جارٍ فتح الملف...');
  try {
    var f = await fetchFile(kind, id, function (x) { show('جارٍ فتح الملف... ' + Math.round(x * 100) + '%'); });
    var url = URL.createObjectURL(f.blob);
    setTimeout(function () { URL.revokeObjectURL(url); }, 600000);
    var viewable = f.mime === 'application/pdf' || /^image\/(jpeg|png|webp)$/.test(f.mime);
    if (save || !viewable) {
      if (tab) tab.close();
      var a = document.createElement('a');
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
    } else if (tab) tab.location.href = url;
    else openModal(f.name, '<div class="actions"><a class="btn pri" target="_blank" href="' + esc(url) + '">عرض</a></div>');
    toast('✓ جاهز', 'ok');
  } catch (e) {
    if (tab) tab.close();
    toast(e.message, 'bad');
  } finally { fileBusy = false; }
}

// ---------- Site photos ----------
// Reads the date the photo was taken from its EXIF data (DateTimeOriginal, else DateTime). Returns 'yyyy-mm-dd HH:mm' or ''.
function readExifDate(file) {
  return new Promise(function (resolve) {
    var r = new FileReader();
    r.onerror = function () { resolve(''); };
    r.onload = function () {
      try {
        var v = new DataView(r.result);
        if (v.getUint16(0) !== 0xFFD8) return resolve('');
        var off = 2;
        while (off + 4 < v.byteLength) {
          var marker = v.getUint16(off), len = v.getUint16(off + 2);
          if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return resolve(parseTiff(v, off + 10));
          if ((marker & 0xFF00) !== 0xFF00) break;
          off += 2 + len;
        }
      } catch (e) { }
      resolve('');
    };
    r.readAsArrayBuffer(file.slice(0, 256 * 1024));
  });
  function parseTiff(v, t) {
    var le = v.getUint16(t) === 0x4949;
    var u16 = function (o) { return v.getUint16(o, le); }, u32 = function (o) { return v.getUint32(o, le); };
    var ascii = function (o, n) { var s = ''; for (var i = 0; i < n; i++) { var c = v.getUint8(o + i); if (!c) break; s += String.fromCharCode(c); } return s; };
    var readIfd = function (o, tags) {
      var n = u16(o), found = {};
      for (var i = 0; i < n; i++) {
        var e = o + 2 + i * 12, tag = u16(e);
        if (tags.indexOf(tag) >= 0) found[tag] = tag === 0x8769 ? u32(e + 8) : ascii(t + u32(e + 8), 19);
      }
      return found;
    };
    var ifd0 = readIfd(t + u32(t + 4), [0x0132, 0x8769]);
    var exif = ifd0[0x8769] ? readIfd(t + ifd0[0x8769], [0x9003]) : {};
    var raw = exif[0x9003] || ifd0[0x0132] || '';
    var m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(raw);
    return m && m[1] > '1990' ? m[1] + '-' + m[2] + '-' + m[3] + ' ' + m[4] + ':' + m[5] : '';
  }
}

function loadImage(file) {
  if (window.createImageBitmap) return createImageBitmap(file).catch(function () { return loadImgTag(file); });
  return loadImgTag(file);
}
function loadImgTag(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { res(img); };
    img.onerror = function () { rej(new Error('تعذر قراءة الصورة (صيغة غير مدعومة). التقط الصورة بالكاميرا أو حوّلها إلى JPG.')); };
    img.src = url;
  });
}
function canvasBlob(c, q) { return new Promise(function (res) { c.toBlob(function (b) { res(b); }, 'image/jpeg', q); }); }

// Shrinks the photo (longest side 1600 px) and prints the date and the project name on it.
async function preparePhoto(file, projectName) {
  var takenAt = await readExifDate(file);
  var img = await loadImage(file);
  var w0 = img.width, h0 = img.height, k = Math.min(1, 1600 / Math.max(w0, h0));
  var w = Math.round(w0 * k), h = Math.round(h0 * k);
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  var now = new Date(), pad = function (n) { return ('0' + n).slice(-2); };
  var uploadStamp = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  var shown = takenAt || uploadStamp;
  var label = (takenAt ? 'تاريخ الالتقاط: ' : 'تاريخ الرفع: ') + fmtDate(shown.slice(0, 10)) + ' ' + shown.slice(11, 16);
  var band = Math.max(30, Math.round(Math.min(w, h) * 0.06));
  x.fillStyle = 'rgba(0,0,0,0.6)'; x.fillRect(0, h - band, w, band);
  x.fillStyle = '#fff'; x.textBaseline = 'middle';
  x.font = '600 ' + Math.round(band * 0.46) + 'px "IBM Plex Sans Arabic", Tahoma, Arial';
  x.direction = 'rtl'; x.textAlign = 'right';
  x.fillText(label, w - band * 0.35, h - band / 2);
  var name = String(projectName || '');
  x.font = Math.round(band * 0.4) + 'px "IBM Plex Sans Arabic", Tahoma, Arial';
  var room = w - x.measureText(label).width - band * 1.4;
  while (name.length > 4 && x.measureText(name).width > room) name = name.slice(0, -2);
  if (name !== String(projectName || '')) name += '…';
  x.textAlign = 'left'; x.fillText(name, band * 0.35, h - band / 2);
  var blob = await canvasBlob(c, 0.82);
  // small preview shown inside the platform
  var t = document.createElement('canvas'), tk = 320 / Math.max(w, h);
  t.width = Math.round(w * tk); t.height = Math.round(h * tk);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  var thumb = t.toDataURL('image/jpeg', 0.65);
  if (thumb.length > 44000) thumb = t.toDataURL('image/jpeg', 0.45);
  var fname = 'صورة موقع ' + shown.slice(0, 10) + ' ' + shown.slice(11, 16).replace(':', '') + '.jpg';
  return { file: new File([blob], fname, { type: 'image/jpeg' }), takenAt: takenAt, thumb: thumb };
}

// Actual work cost compared with the budget (an exact match or the difference).
function costBadge(cost, budget, cur) {
  var diff = Math.round((Number(cost) - Number(budget)) * 100) / 100;
  if (!diff) return '<span class="badge b-green">التكلفة مطابقة للموازنة</span>';
  return diff > 0 ? '<span class="badge b-red">التكلفة أعلى من الموازنة بـ ' + fmtNum(diff) + ' ' + cur + '</span>'
    : '<span class="badge b-blue">التكلفة أقل من الموازنة بـ ' + fmtNum(-diff) + ' ' + cur + '</span>';
}

// One history entry: what kind of change, when, who, and old ← new values.
function kindLabel(k) { return k === 'تمديد معتمد' ? 'أمر تغييري بالمدة' : k; }
function settingText(t) { return String(t).split('تاريخ الإنجاز المعتمد').join('تاريخ الإنهاء التعاقدي').split('لتاريخ الإنجاز').join('لتاريخ الإنهاء التعاقدي').split('موعد الإنجاز').join('تاريخ الإنهاء التعاقدي'); }
function historyItem(u, showProject) {
  var parts = [];
  if (u.changes) parts.push('<span style="white-space:pre-wrap">' + esc(u.changes) + '</span>');
  else if (u.kind === 'تحديث دوري') { // entries saved before change tracking existed
    parts.push('الحالة: ' + esc(u.status) + (u.progress !== '' ? ' · الإنجاز: ' + fmtNum(u.progress) + '%' : ''));
    if (u.obstacle) parts.push('العائق: ' + esc(u.obstacle));
    if (u.requiredAction) parts.push('الإجراء المطلوب: ' + esc(u.requiredAction));
  }
  if (u.note) parts.push('ملاحظة: ' + esc(u.note));
  return '<li><div><b>' + esc(kindLabel(u.kind)) + '</b>' + (showProject ? ' · <a href="#" data-act="open" data-arg="' + esc(u.projectId) + '">' + esc(u.projectName) + '</a>' : '') +
    ' <span class="muted small">' + fmtStamp(u.at) + '</span> · ' + who(u.by, true) + '</div><div class="small">' + parts.join('<br>') + '</div></li>';
}

async function loadActivity() {
  try { S.activity = await call('activity.list'); if (S.view === 'activity') render(); }
  catch (e) { var b = document.getElementById('act'); if (b) b.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }

function activityFiltered() {
  var f = S.af || {}, q = (f.q || '').toLowerCase();
  return S.activity.items.filter(function (u) {
    if (f.by && u.by !== f.by) return false;
    if (f.kind && u.kind !== f.kind) return false;
    if (f.from && String(u.at).slice(0, 10) < f.from) return false;
    if (q && (u.projectName + ' ' + u.changes + ' ' + u.note).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function viewActivity() {

function closeModal(force) {

function filePick(id, accept, multiple) {

}
document.addEventListener('change', function (e) {
  var box = e.target && e.target.closest ? e.target.closest('.filepick') : null;
  if (!box) return;
  var f = e.target.files, name = box.querySelector('.fp-name');
  name.textContent = !f || !f.length ? 'لم يتم الاختيار بعد' : f.length === 1 ? f[0].name : f.length + ' ملفات';
});
function fieldHtml(id, label, input, hint) {

function setBusy(btn, busy, text) {

  if (!btn) return;
  if (busy) { btn.dataset.t = btn.textContent; btn.disabled = true; btn.textContent = text || 'جارٍ الحفظ...'; }
  else { btn.disabled = false; btn.textContent = btn.dataset.t || btn.textContent; }
}
function showErr(msg) {
  var e = $modal.querySelector('.err');

// ---------- Upload ----------
var EXT_MIME = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif' };
function mimeOf(file) {
  if (file.type) return file.type;
  var m = /\.([a-z0-9]+)$/i.exec(file.name);
  return m ? EXT_MIME[m[1].toLowerCase()] || '' : '';
}
function readB64(blob) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1] || ''); };
    r.onerror = function () { rej(new Error('تعذرت قراءة الملف من جهازك')); };
    r.readAsDataURL(blob);
  });
}
var uploadCancel = false;
async function sendFile(file, projectId, docType, onProgress, replaceId, workOrderId, photo) {
  var st = await call('upload.start', { projectId: projectId, docType: docType, fileName: file.name, mimeType: mimeOf(file), size: file.size, replaceId: replaceId || '', workOrderId: workOrderId || '', photo: photo || null });
  var offset = 0;
  try {
    while (offset < file.size) {
      if (uploadCancel) throw new Error('تم إلغاء الرفع');
      var b64 = await readB64(file.slice(offset, Math.min(offset + st.chunkSize, file.size)));
      var r, tries = 0;
      for (;;) {
        try { r = await call('upload.chunk', { uploadId: st.uploadId, offset: offset, data: b64 }); break; }
        catch (e) {
          tries++;
          if (tries >= 4 || /انتهت|خلل|الجزء|صلاحية/.test(e.message)) throw e;
          onProgress(offset / file.size, 'انقطاع مؤقت، إعادة المحاولة (' + tries + ')...');
          await sleep([2000, 5000, 10000][tries - 1]);
        }
      }
      if (r.done) { onProgress(1); return r.attachment || r.photo; }
      offset = r.received;
      onProgress(offset / file.size);
    }
    throw new Error('لم يكتمل الرفع');
  } catch (e) {
    call('upload.abort', { uploadId: st.uploadId }).catch(function () { });
    throw e;
  }
}

// ---------- Projects register (printable report) ----------
function dayDiff(fromISO, toISO) {
  var p = function (x) { var q = String(x).split('-'); return Date.UTC(+q[0], +q[1] - 1, +q[2]); };
  return Math.round((p(toISO) - p(fromISO)) / 86400000);
}
// Delay against the latest approved completion date: finished -> actual vs approved; running -> today vs approved.
function delayOf(p, today) {
  var end = p.ind.applicableEnd;
  if (!end) return null;
  if (p.actualCompletionDate) return dayDiff(end, p.actualCompletionDate);
  if (p.ind.active && today > end) return dayDiff(end, today);
  return null;
}
function delayCell(d) {
  if (d === null) return '<span class="muted">—</span>';
  if (d > 0) return '<b style="color:var(--red)">متأخر ' + d + ' يوم</b>';
  if (d < 0) return '<span style="color:var(--green)">مبكر ' + (-d) + ' يوم</span>';
  return 'في الموعد';
}
async function loadRegisterOrders() {
  try { S.regOrders = await call('report.workOrders'); if (S.view === 'report') render(); }
  catch (e) { S.regOrders = {}; toast(e.message, 'bad'); }
}
// A project belongs to year y if it finished in y, started in y, or was still running in y.
function inYear(p, y) {
  var ny = String(p.ntpDate || '').slice(0, 4);
  return (p.status === 'منجز' && endYear(p) === y) || ny === y || (p.status !== 'منجز' && ny && ny <= y);
}
// Year summary (the former annual report), shown above the register when a year is chosen.
function yearSummary(rows, y) {
  var today = S.boot.today;

    fieldHtml('ue-title', 'المسمى الوظيفي', '<input id="ue-title" value="' + esc(u.title || '') + '" placeholder="مثال: رئيس قسم المشاريع، مهندس البلدية، مدير الدائرة الهندسية">') +
    fieldHtml('ue-role', 'الدور (الصلاحية) *', '<select id="ue-role">' + Object.keys(A.roles).map(function (r) { return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + esc(A.roles[r]) + '</option>'; }).join('') + '</select>',
      'رئيس قسم: يرى ويحدّث كل مشاريع الأقسام المختارة · مهندس: ' + (S.boot.engineerOwn ? 'يرى ويحدّث فقط المشاريع المختار لها كمهندس مشرف' : 'يرى ويحدّث مشاريع الأقسام المختارة') + ' · الإدارة: ترى كل المشاريع دون تعديل · مهندس البلدية: يعدّل كل المشاريع ويرسل ملاحظات لمهندسي المشاريع، دون إدارة المنصة · مدير النظام: صلاحيات كاملة (مثل مدير الدائرة الهندسية)') +
    '<div class="field"><label>الأقسام (لرئيس القسم)</label>' + A.departments.map(function (d) { return '<label class="check" style="font-weight:400"><input type="checkbox" class="ue-dept" value="' + esc(d.id) + '"' + (ids.indexOf(d.id) >= 0 ? ' checked' : '') + '> ' + esc(d.name) + '</label>'; }).join('') + '</div>' +
    '<div class="field"><label class="check"><input type="checkbox" id="ue-active"' + (u.active === 'نعم' ? ' checked' : '') + '> الحساب مفعّل</label></div>' +
    '<div class="field"><label class="check"><input type="checkbox" id="ue-notify"' + (u.notify === 'نعم' ? ' checked' : '') + '> يستلم تذكيرات البريد</label></div>' +
    '<div class="actions"><button class="btn pri" type="submit" id="ue-save">حفظ</button><button class="btn" type="button" data-act="close-modal">إلغاء</button></div></form>',
    function () {
      $('#mf').addEventListener('submit', async function (e) {
        e.preventDefault(); if (modalBusy) return;
        var btn = $('#ue-save'); setBusy(btn, true, 'جارٍ الحفظ وتحديث الصلاحيات...');
        try {
          var r = await call('admin.saveUser', { data: { email: val('ue-email'), name: val('ue-name'), title: val('ue-title'), role: val('ue-role'), active: val('ue-active'), notify: val('ue-notify'),
            deptIds: Array.prototype.map.call($modal.querySelectorAll('.ue-dept:checked'), function (c) { return c.value; }) } }, { requestId: reqId });
          setBusy(btn, false); closeModal(true); toast('✓ تم حفظ المستخدم', 'ok');
          S.admin = null; render();
        } catch (err) { setBusy(btn, false); showErr(err.message); }
      });
    });
}
function openDeptEdit(id) {
  var d = S.admin.departments.filter(function (x) { return x.id === id; })[0] || { active: 'نعم', parent: 'الدائرة الهندسية' };
  var reqId = rid();
  openModal(id ? 'تعديل قسم' : 'إضافة قسم', '<form id="mf">' +
    fieldHtml('de-name', 'اسم القسم *', '<input id="de-name" value="' + esc(d.name || '') + '">') +
    fieldHtml('de-parent', 'الدائرة', '<input id="de-parent" value="' + esc(d.parent || '') + '">') +
    (id ? '<div class="field"><label class="check"><input type="checkbox" id="de-active"' + (d.active === 'نعم' ? ' checked' : '') + '> مفعّل</label></div>' : '') +
    '<div class="actions"><button class="btn pri" type="submit" id="de-save">حفظ</button><button class="btn" type="button" data-act="close-modal">إلغاء</button></div></form>',
    function () {
      $('#mf').addEventListener('submit', async function (e) {
        e.preventDefault(); if (modalBusy) return;
        var btn = $('#de-save'); setBusy(btn, true);
        try {
          await call('admin.saveDepartment', { data: { id: id, name: val('de-name'), parent: val('de-parent'), active: id ? val('de-active') : true } }, { requestId: reqId });
          setBusy(btn, false); closeModal(true); toast('✓ تم حفظ القسم', 'ok'); S.admin = null; await refreshBoot(); render();
        } catch (err) { setBusy(btn, false); showErr(err.message); }
      });
    });
}

async function adminAction(action, outId, fmt) {
  var out = document.getElementById(outId);
  out.innerHTML = loading('جارٍ التنفيذ...');
  try { var r = await call(action, {}); out.innerHTML = fmt(r); }
  catch (e) { out.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

// ---------- Event delegation ----------
var ACT = {
  'note-new': function () { openNote(); },
  'note-del': function (id) { openNoteDelete(id); },
  nav: function (v) { if (v === 'list' || v === 'mine') S.f = {}; if (v === 'admin') S.admin = null; if (v === 'activity') S.activity = null; go(v); },
  logout: function () { call('auth.logout', {}).catch(function () { }); endSession(); renderLogin(); },
  'login-back': function () { loginStage = 'email'; renderLogin(); },
  'login-resend': function () { sendCode(true); },
  reload: function () { start(); },
  'print-page': function () { window.print(); },
  kpi: function (k) {
    S.f = { __set: 1, status: 'active', ind: k === 'active' ? '' : k };
    go(deptRole() ? 'mine' : 'list');
  },
  cell: function (arg) {
    var p = arg.split('|');
    S.f = { __set: 1, dept: p[0], status: p[1] === 'all' ? 'all' : p[1] };
    go(deptRole() ? 'mine' : 'list');
  },
  open: function (id) { go('project', { id: id, from: S.view === 'project' ? S.params.from : S.view }); },
  back: function () { go(S.params.from || homeView()); }, // in-app: back to the page the project was opened from, filters kept
  update: openUpdate,
  contract: function () { openContract(false); },
  'new-project': function () { openContract(true); },
  extension: function () { openVO(''); },
  'vo-new': function () { openVO(''); },
  'vo-edit': function (id) { openVO(id); },
  'vo-copy': function (id) { openUploadModal(S.detail.project.id, vw(S.detail.project).doc, id); },
  'upload-here': function () { openUploadModal(S.detail.project.id); },
  'upload-type': function (t) { openUploadModal(S.detail.project.id, t); },
  'photo-upload': function () { openPhotoUpload(''); },
  'photo-more': loadMoreThumbs,
  'photo-del': function (id) {
    var pid = S.detail.project.id;
    openModal('إزالة صورة', '<form id="mf"><p>ستُزال الصورة من المشروع وتُنقل إلى مجلد غير مشترك (لا تُحذف نهائياً)، ويُسجَّل ذلك في سجل التعديلات.</p><div class="actions"><button class="btn danger" type="submit" id="pd">إزالة الصورة</button><button class="btn" type="button" data-act="close-modal">إلغاء</button></div></form>', function () {
      $('#mf').addEventListener('submit', async function (e) {
        e.preventDefault(); var btn = $('#pd'); setBusy(btn, true);
        try { await call('photo.delete', { id: id }, { requestId: rid() }); setBusy(btn, false); closeModal(true); toast('تمت إزالة الصورة', 'ok'); await afterWrite(pid); }
        catch (err) { setBusy(btn, false); showErr(err.message); }
      });
    });
  },
  'wo-new': function () { openWorkOrder(''); },
  'rq-new': function () { openQuotation(''); },
  'rq-edit': function (id) { openQuotation(id); },
  'wo-edit': function (id) { openWorkOrder(id); },
  'wo-upload': function (id) { openUploadModal(S.detail.project.id, '', id); },
  'wo-copy': function (id) { openUploadModal(S.detail.project.id, S.boot.decisionCopy, id); },
  'budget-inc': openBudgetIncrease,
  print: function () { window.print(); },
  'close-modal': function () { closeModal(false); if (S.view === 'project' && S.detail) render(); },
  'edit-att': openAttachmentEdit,
  'del-project': openProjectDelete,
  'adm-tab': function (t) { S.adminTab = t; render(); },
  'user-edit': openUserEdit,
  'dept-edit': openDeptEdit,
  'rem-preview': function () {
    adminAction('admin.reminderPreview', 'rem-out', function (r) {
      return '<p class="small">التذكيرات ' + (r.enabled ? 'مفعّلة' : '<b>معطّلة من الإعدادات</b>') + ' · رصيد البريد اليوم: ' + r.quota + '</p>' +
        (r.items.length ? '<table class="t"><tr><th>المشروع</th><th>النوع</th><th>التاريخ المعتمد</th><th>الأيام</th></tr>' + r.items.map(function (i) { return '<tr><td>' + esc(i.name) + '</td><td>' + esc(i.type) + '</td><td>' + fmtDate(i.end) + '</td><td>' + (i.daysLeft === null ? '—' : i.daysLeft) + '</td></tr>'; }).join('') + '</table>' +
          '<p class="small">المستلمون: ' + r.recipients.map(function (x) { return '<span class="ltr">' + esc(x.email) + '</span> (' + x.count + ')'; }).join('، ') + (r.recipients.length ? '' : '<b>لا يوجد مستلمون مفعّلون</b>') + '</p>'
          : '<p class="muted">لا توجد تذكيرات مستحقة الآن.</p>');
    });
  },
  'rem-run': function () {
    adminAction('admin.runReminders', 'rem-out', function (r) {
      S.admin = null; setTimeout(loadAdmin, 1500);
      return r.skipped ? '<div class="err">التذكيرات معطّلة من الإعدادات</div>' :
        '<div class="okbox">تمت المعالجة: ' + r.items + ' تذكير مستحق، أُرسلت ' + r.emails + ' رسالة.' + (r.failures.length ? '<br>أخطاء: ' + esc(r.failures.join('، ')) : '') + '</div>';
    });
  },
  backup: function () { adminAction('admin.backupNow', 'sys-out', function (r) { return '<div class="okbox">✓ تم إنشاء النسخة: ' + esc(r.name) + '</div>'; }); },
  'file-view': function (id) { openFile('attachment', id, false); },
  'file-save': function (id) { openFile('attachment', id, true); },
  'photo-view': function (id) { openFile('photo', id, false); }
};
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (!t) {
    if (e.target.classList && e.target.classList.contains('modal-bg')) ACT['close-modal']();
    return;
  }
  var fn = ACT[t.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(t.dataset.arg === undefined ? undefined : t.dataset.arg);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $modal.innerHTML) ACT['close-modal'](); });
window.addEventListener('beforeunload', function (e) { if (modalBusy) { e.preventDefault(); e.returnValue = ''; } });

// ---------- Boot ----------
S.token = lsGet('pm_token');
if (S.token) start(); else renderLogin();
window.__PM = S; // for diagnostics
window.__PM_PHOTO = { preparePhoto: preparePhoto, readExifDate: readExifDate }; // used by the automated photo test
})();
</script>
